  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
    }

    aside {
      width: 250px;
      background: #1e293b;
      padding: 30px 20px;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    aside h1 {
      font-size: 24px;
      color: #7c3aed;
      margin-bottom: 40px;
      text-align: center;
    }

    .menu a {
      display: block;
      color: #cbd5e1;
      padding: 12px 15px;
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: 0.3s;
    }

    .menu a.active, .menu a:hover {
      background: #7c3aed;
      color: #fff;
    }

    main {
      margin-left: 250px;
      padding: 40px;
      flex: 1;
    }

    .header {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #facc15;
    }

    .form input,
    .form select,
    .form textarea {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      border: none;
      background: #334155;
      color: white;
    }

    .form button,
    .form a {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      margin: 5px;
      background-color: #7c3aed;
      color: white;
      cursor: pointer;
      text-decoration: none;
    }

    .form button:hover {
     background-color: #a069ff;
     
    }

    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }

    #capture {
      width: 1080px;
      height: 1080px;
      position: relative;
      margin: 30px auto;
      overflow: hidden;
      background: linear-gradient(to top, #4c1d95 0%, #1e3a8a 12%,  #000000 45%);
      transform: translateZ(0);
       position: relative;
    }

    #capture img.bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
    }

    #capture img.logo {
      position: absolute;
      top: 15px;
      left: 20px;
      width: 90px;
      z-index: 3;
    }
    #sporTag ,
#ekonomiTag ,
  #breakingTag {
   position: absolute;
  top: 50%;
  right: 0;
  transform: translateY(-50%);

  color: white;
  padding: 10px 6px;
  font-size: 16px;
  font-weight: lighter;
  font-family: sans-serif;
  border-radius: 6px 0 0 6px;
  box-shadow: -2px 0 8px rgba(0,0,0,0.2);
  z-index: 9999;
  text-align: center;
  line-height: 1.2;
  letter-spacing: 1px;
   display: none;
}

#breakingTag {
  background-color: #dc262680; /* Kırmızı */
  color: #fff;
}

#sporTag {
  background-color: #10b98173; /* Yeşil */
  color: #fff;
}

#ekonomiTag {
  background-color: #f59f0b69; /* Turuncu */
  color: #fff;
}

    #headline {
      position: absolute;
      top: 70%;
      left: 8%;
      text-align: left;
      font-size: 48px;
      z-index: 3;
      color: white;
      font-weight: bold;
      text-shadow: 0 7px 9px rgba(0, 0, 0, 0.3);
      word-break: break-word;
    }

    #desc {
      position: absolute;
      top: 77%;
      left: 8%;
      right: 8%;
      text-align: left;
      font-size: 28px;
      z-index: 3;
      color: white;
      line-height: 1.4;
      word-break: break-word;
    }

  .footer-img {
  position: absolute;
  left: 0;
  right: 0;
  margin: auto;
  z-index: 3;

}


#menuToggle {
  display: none;
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 100;
  font-size: 28px;
  color: white;
  cursor: pointer;
}

#editorModal {
   display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgb(24, 24, 24);
  border: 1px solid #ccc;
  padding: 20px;
  z-index: 1000;
  width: 300px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.8);
  border-radius: 10px;
  
}



 #cropModal {
    display: none; /* Başta kapalı */
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  #cropContainer {

      background: rgb(24, 24, 24);
  padding: 10px;
  border-radius: 8px;
  max-width: 95vw;
  max-height: 95vh;
  overflow: auto;
  }
  #imageToCrop {
      width: 100%;
  max-width: 90vw;
  max-height: 90vh;
  display: block;
  }

    .arrow {
    --active: #fff;
    --border: rgba(255, 255, 255, .12);
    display: block;
    position: relative;
    width: 44px;
    height: 44px;
    &.left {
        transform: scaleX(-1);
    }
    i {
        display: block;
        position: absolute;
        margin: -10px 0 0 -10px;
        width: 20px;
        height: 20px;
        left: 50%;
        top: 50%;
        &:before,
        &:after {
            content: '';
            width: 10px;
            height: 2px;
            border-radius: 1px;
            position: absolute;
            left: 50%;
            top: 50%;
            background: var(--active);
            margin: -1px 0 0 -5px;
            display: block;
            transform-origin: 9px 50%;
        }
        &:before {
            transform: rotate(-40deg);
        }
        &:after {
            transform: rotate(40deg);
        }
    }
    &:before,
    &:after {
        content: '';
        display: block;
        position: absolute;
        left: 1px;
        right: 1px;
        top: 1px;
        bottom: 1px;
        border-radius: 50%;
        border: 2px solid var(--border);
    }
    svg {
        width: 44px;
        height: 44px;
        display: block;
        position: relative;
        z-index: 1;
        color: var(--active);
        stroke-width: 2px;
        stroke-dashoffset: 126;
        stroke-dasharray: 126 126 0;
        transform: rotate(0deg);
    }
    &.animate {
        svg {
            animation: stroke 1s ease forwards .3s;
        }
        i {
            animation: arrow 1.6s ease forwards;
            &:before {
                animation: arrowUp 1.6s ease forwards;
            }
            &:after {
                animation: arrowDown 1.6s ease forwards;
            }
        }
    }
}

@keyframes stroke {
    52% {
        transform: rotate(-180deg);
        stroke-dashoffset: 0;
    }
    52.1% {
        transform: rotate(-360deg);
        stroke-dashoffset: 0;
    }
    100% {
        transform: rotate(-180deg);
        stroke-dashoffset: 126;
    }
}

@keyframes arrow {
    0%,
    100% {
        transform: translateX(0);
        opacity: 1;
    }
    23% {
        transform: translateX(17px);
        opacity: 1;
    }
    24%,
    80% {
        transform: translateX(-22px);
        opacity: 0;
    }
    81% {
        opacity: 1;
        transform: translateX(-22px);
    }
}

@keyframes arrowUp {
    0%,
    100% {
        transform: rotate(-40deg) scaleX(1);
    }
    20%,
    80% {
        transform: rotate(0deg) scaleX(.1);
    }
}

@keyframes arrowDown {
    0%,
    100% {
        transform: rotate(40deg) scaleX(1);
    }
    20%,
    80% {
        transform: rotate(0deg) scaleX(.1);
    }
}





@media (max-width: 768px) {
  aside {
    left: -250px;
    transition: left 0.3s ease;
    z-index: 99;
  }

  aside.active {

  }

  main {
    margin-left: 0;

  }

  #capture {
    width: 100%;
    height: auto;
    aspect-ratio: 1/1;

  }
   .footer-img {
    width: 100%;

     #headline {

      text-align: left;
      font-size: 3vw;
      z-index: 3;
      color: white;
      font-weight: bold;

      text-align: left;
      font-size: 2vw;
      z-index: 3;
      color: white;
      line-height: 1.4;
      word-break: break-word;
    }
     #capture img.logo {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 130px;
      z-index: 3;
    }
  

}

  <script>
function updateFontSizes() {
  const headlineSize = document.getElementById('headlineFontSize').value;
  const descSize = document.getElementById('descFontSize').value;

  document.getElementById('headline').style.fontSize = `${headlineSize}px`;
  document.getElementById('desc').style.fontSize = `${descSize}px`;

  document.getElementById('headlineSizeValue').textContent = headlineSize;
  document.getElementById('descSizeValue').textContent = descSize;
}

function copyDescription() {
  const textarea = document.getElementById("inputDesc");
  textarea.select();
  textarea.setSelectionRange(0, 99999); // mobil uyum için

  document.execCommand("copy");

  alert("Açıklama panoya kopyalandı!");
}


    function toggleSidebar() {
  document.querySelector("aside").classList.toggle("active");
}


    document.getElementById('inputHeadline').addEventListener('input', updateVisual);
    document.getElementById('inputDesc').addEventListener('input', updateVisual);
    document.getElementById('bgInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        document.getElementById('bgImage').src = url;
        updateVisual();
      }
    });

    function updateVisual() {
      document.getElementById('headline').textContent = document.getElementById('inputHeadline').value;
      document.getElementById('desc').textContent = document.getElementById('inputDesc').value;
    }

    async function downloadImage() {
  const capture = document.getElementById('capture');

  // Orijinal boyutu sakla
  const originalWidth = capture.style.width;
  const originalHeight = capture.style.height;

  // Geçici olarak sabit 1080x1080 yap
  capture.style.width = "1080px";
  capture.style.height = "1080px";

  // html2canvas ile yüksek çözünürlükte render al
  const canvas = await html2canvas(capture, {
    useCORS: true,
    backgroundColor: null,
    width: 1080,
    height: 1080,
    scale: 1, // burada scale artırılabilir ama 1 ideal sabit boyutta
  });

  // İndir
  const link = document.createElement('a');
  link.download = 'haber-gorseli.png';
  link.href = canvas.toDataURL('image/png');
  link.click();

  // Orijinal boyutu geri döndür
  capture.style.width = originalWidth;
  capture.style.height = originalHeight;
}

const charCount = document.getElementById('charCount');
inputDesc.addEventListener('input', () => {

 // Font seçmek için
function updateFont() {
  const font = document.getElementById('fontSelect').value;
  document.getElementById('headline').style.fontFamily = font;
  document.getElementById('desc').style.fontFamily = font;
}

 // Temaya Göre Arka Plan Rengi Değiştirme
function updateCategoryTheme() {
  const category = document.getElementById("categorySelect").value;
  const capture = document.getElementById("capture");
  const breakingTag = document.getElementById("breakingTag");
  const sporTag = document.getElementById("sporTag");
  const ekonomiTag = document.getElementById("ekonomiTag");

  switch (category) {
    case "spor":
      capture.style.background = "linear-gradient(to top, #065f46 0%, #10b981 12%, #000000 45%)";
      breakingTag.style.display = "none";
      sporTag.style.display = "block"; // görünür yap
      ekonomiTag.style.display = "none"; // görünür yap
      break;
    case "ekonomi":
      capture.style.background = "linear-gradient(to top, #78350f 0%, #f59e0b 12%, #000000 45%)";
      breakingTag.style.display = "none";
      sporTag.style.display = "none";
      ekonomiTag.style.display = "block"; // görünür yap
      break;
    case "sondakika":
      capture.style.background = "linear-gradient(to top, #7f1d1d 0%, #dc2626 12%, #000000 45%)";
      breakingTag.style.display = "block"; // görünür yap
      sporTag.style.display = "none";
      ekonomiTag.style.display = "none"; // görünür yap
      break;
    case "gundem":
    default:
      capture.style.background = "linear-gradient(to top, #4c1d95 0%, #1e3a8a 12%,  #000000 45%)";
      breakingTag.style.display = "none";
      sporTag.style.display = "none";
      ekonomiTag.style.display = "none"; // görünür yap
      break;
  }
}

function addYanaKaydiriniz() {
  const input = document.getElementById('inputDesc');
  const desc = document.getElementById('desc');

  // Metni ekle
  input.value += ' Yana Kaydırınız';

  // HTML olarak biçimle
  desc.innerHTML = cleanText = input.value.replace(
    'Yana Kaydırınız',
    '<span style="display: inline-flex; align-items: center; gap: 8px;"><a href="#" class="arrow right"><i></i><svg><use xlink:href="#circle"></use></svg></a><span>Yana Kaydırınız</span></span>'
  );
}

//urlden img ekleme
function setBgFromUrl() {
  const url = document.getElementById('bgUrlInput').value;
  if (url) {
    document.getElementById('bgImage').src = url;
    updateVisual();
  }
}
function toggleEditor() {
  const modal = document.getElementById('editorModal');
  modal.style.display = modal.style.display === 'none' ? 'block' : 'none';
}

function copyDesc() {
  const descText = document.getElementById('desc').innerText;
  navigator.clipboard.writeText(descText).then(() => {
    alert('Açıklama kopyalandı!');
  });
}

//görsel düzenleme 
 let cropper;

  function openCropModal() {
    const cropModal = document.getElementById('cropModal');
    const imageToCrop = document.getElementById('imageToCrop');
    const bgImage = document.getElementById('bgImage');

    if (!bgImage.src) {
      alert("Önce arka plan resmi seçin veya yükleyin.");
      return;
    }

    imageToCrop.src = bgImage.src;
    cropModal.style.display = 'flex';

    if (cropper) {
      cropper.destroy();
    }

    cropper = new Cropper(imageToCrop, {
      aspectRatio: 1,
      viewMode: 1,
      autoCropArea: 1,
    });
  }

  function closeCropModal() {
    const cropModal = document.getElementById('cropModal');
    cropModal.style.display = 'none';

    if (cropper) {
      cropper.destroy();
      cropper = null;
    }
  }

  function cropImage() {
    if (!cropper) return;

    const canvas = cropper.getCroppedCanvas({
      width: 800,
      height: 800,
    });

    const croppedDataUrl = canvas.toDataURL('image/png');
    document.getElementById('bgImage').src = croppedDataUrl;

    closeCropModal();
  }
document.getElementById('cropModal').addEventListener('click', function (e) {
  if (e.target.id === 'cropModal') {
    closeCropModal();
  }
});
  </script>
