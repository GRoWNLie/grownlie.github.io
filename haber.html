  <style>

    #desc {

      top: 77%;

      font-size: 28px;
      z-index: 3;
      color: white;
      line-height: 1.4;
      word-break: break-word;

  .footer-img {

  right: 0;
  margin: auto;

}


#menuToggle {

#editorModal {

 #cropModal {

    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
    z-index: 9999;

  #cropContainer {

      background: rgb(24, 24, 24);
  padding: 10px;
  border-radius: 8px;
  max-width: 95vw;

  overflow: auto;
  }
  #imageToCrop {
      width: 100%;
  max-width: 90vw;
  max-height: 90vh;
  display: block;
  }

    .arrow {
    --active: #fff;
    --border: rgba(255, 255, 255, .12);
    display: block;
    position: relative;
    width: 44px;
    height: 44px;
    &.left {
        transform: scaleX(-1);
    }
    i {
        display: block;
        position: absolute;
        margin: -10px 0 0 -10px;
        width: 20px;
        height: 20px;
        left: 50%;
        top: 50%;
        &:before,
        &:after {
            content: '';
            width: 10px;
            height: 2px;
            border-radius: 1px;
            position: absolute;
            left: 50%;
            top: 50%;
            background: var(--active);
            margin: -1px 0 0 -5px;
            display: block;
            transform-origin: 9px 50%;
        }
        &:before {
            transform: rotate(-40deg);
        }
        &:after {
            transform: rotate(40deg);
        }
    }
    &:before,
    &:after {
        content: '';
        display: block;
        position: absolute;
        left: 1px;
        right: 1px;
        top: 1px;
        bottom: 1px;
        border-radius: 50%;
        border: 2px solid var(--border);
    }
    svg {
        width: 44px;
        height: 44px;
        display: block;
        position: relative;
        z-index: 1;
        color: var(--active);
        stroke-width: 2px;
        stroke-dashoffset: 126;
        stroke-dasharray: 126 126 0;
        transform: rotate(0deg);
    }
    &.animate {
        svg {
            animation: stroke 1s ease forwards .3s;
        }
        i {
            animation: arrow 1.6s ease forwards;
            &:before {
                animation: arrowUp 1.6s ease forwards;
            }
            &:after {
                animation: arrowDown 1.6s ease forwards;
            }
        }
    }
}

@keyframes stroke {
    52% {
        transform: rotate(-180deg);
        stroke-dashoffset: 0;
    }
    52.1% {
        transform: rotate(-360deg);
        stroke-dashoffset: 0;
    }
    100% {
        transform: rotate(-180deg);
        stroke-dashoffset: 126;
    }
}

@keyframes arrow {
    0%,
    100% {
        transform: translateX(0);
        opacity: 1;
    }
    23% {
        transform: translateX(17px);
        opacity: 1;
    }
    24%,
    80% {
        transform: translateX(-22px);
        opacity: 0;
    }
    81% {
        opacity: 1;
        transform: translateX(-22px);
    }
}

@keyframes arrowUp {
    0%,
    100% {
        transform: rotate(-40deg) scaleX(1);
    }
    20%,
    80% {
        transform: rotate(0deg) scaleX(.1);
    }
}

@keyframes arrowDown {
    0%,
    100% {
        transform: rotate(40deg) scaleX(1);
    }
    20%,
    80% {
        transform: rotate(0deg) scaleX(.1);
    }
}





@media (max-width: 768px) {
  aside {
    left: -250px;
    transition: left 0.3s ease;
    z-index: 99;
  }

  }

  #capture {
    width: 100%;
    height: auto;
    aspect-ratio: 1/1;

  }

  }

     #headline {

      top: 70%;
      left: 8%;
      text-align: left;
      font-size: 3vw;
      z-index: 3;
      color: white;
      font-weight: bold;
    }

    #desc {

      z-index: 3;
      color: white;
      line-height: 1.4;
      word-break: break-word;
    }
     #capture img.logo {

      top: 15px;
      left: 15px;
      width: 50px;
      z-index: 3;
    }
  

}

<body>

  <main>

 <label for="headlineFontSize">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
function updateFontSizes() {
  const headlineSize = document.getElementById('headlineFontSize').value;
  const descSize = document.getElementById('descFontSize').value;

  document.getElementById('headline').style.fontSize = `${headlineSize}px`;
  document.getElementById('desc').style.fontSize = `${descSize}px`;

  document.getElementById('headlineSizeValue').textContent = headlineSize;
  document.getElementById('descSizeValue').textContent = descSize;
}

function copyDescription() {
  const textarea = document.getElementById("inputDesc");
  textarea.select();
  textarea.setSelectionRange(0, 99999); // mobil uyum için

  document.execCommand("copy");

  alert("Açıklama panoya kopyalandı!");
}


    function toggleSidebar() {
  document.querySelector("aside").classList.toggle("active");
}


    document.getElementById('inputHeadline').addEventListener('input', updateVisual);
    document.getElementById('inputDesc').addEventListener('input', updateVisual);
    document.getElementById('bgInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        document.getElementById('bgImage').src = url;
        updateVisual();
      }
    });

    function updateVisual() {
      document.getElementById('headline').textContent = document.getElementById('inputHeadline').value;
      document.getElementById('desc').textContent = document.getElementById('inputDesc').value;
    }

    async function downloadImage() {
  const capture = document.getElementById('capture');

  // Orijinal boyutu sakla
  const originalWidth = capture.style.width;
  const originalHeight = capture.style.height;

  // Geçici olarak sabit 1080x1080 yap
  capture.style.width = "1080px";
  capture.style.height = "1080px";

  // html2canvas ile yüksek çözünürlükte render al
  const canvas = await html2canvas(capture, {
    useCORS: true,
      allowTaint: false,
    backgroundColor: null,
    width: 1080,
    height: 1080,
    scale: 1, // burada scale artırılabilir ama 1 ideal sabit boyutta
  });

  // İndir
  const link = document.createElement('a');
  link.download = 'haber-gorseli.png';
  link.href = canvas.toDataURL('image/png');
  link.click();

  // Orijinal boyutu geri döndür
  capture.style.width = originalWidth;
  capture.style.height = originalHeight;
}




    const inputDesc = document.getElementById('inputDesc');
const charCount = document.getElementById('charCount');
inputDesc.addEventListener('input', () => {
  charCount.textContent = `${inputDesc.value.length} / 283`;
});

 // Font seçmek için
function updateFont() {
  const font = document.getElementById('fontSelect').value;
  document.getElementById('headline').style.fontFamily = font;
  document.getElementById('desc').style.fontFamily = font;
}

    function updateCategoryTheme() {
      const category = document.getElementById("categorySelect").value;
      const capture = document.getElementById("capture");
      const breakingTag = document.getElementById("breakingTag");
      const sporTag = document.getElementById("sporTag");
      const ekonomiTag = document.getElementById("ekonomiTag");
      const logoImage = document.getElementById("logoImage");

      // Hepsini gizle
      breakingTag.style.display = "none";
      sporTag.style.display = "none";
      ekonomiTag.style.display = "none";

      // Varsayılan logo ayarları
      let logoSrc = "https://sanishtech.com/i/mvz7gG5fNcZ.png";
      let logoWidth = "120";

      // Kategoriye göre değişim
      switch (category) {
        case "spor":
          capture.style.background = "linear-gradient(to top, #065f46 0%, #10b981 12%, #0000003a 45%)";
          sporTag.style.display = "block";
          logoSrc = "https://sanishtech.com/i/BW7CT5yHJ3a.png";
          logoWidth = "190"; // büyüt
          break;
        case "ekonomi":
          capture.style.background = "linear-gradient(to top, #78350f 0%, #f59e0b 12%, #0000003a 45%)";
          ekonomiTag.style.display = "block";
          logoSrc = "https://sanishtech.com/i/yTiFoSUhJnb.png";
          logoWidth = "190";
          break;
        case "sondakika":
          capture.style.background = "linear-gradient(to top, #7f1d1d 0%, #dc2626 12%, #0000003a 45%)";
          breakingTag.style.display = "block";
          logoSrc = "https://sanishtech.com/i/9HOmEjB4Uw1.png";
          logoWidth = "370";
          break;
        case "gundem":
        default:
          capture.style.background = "linear-gradient(to top, #4c1d95 0%, #1e3a8a 12%,  #0000003a 45%)";
          break;
      }

      // Logo güncelle
      logoImage.src = logoSrc;
      logoImage.width = logoWidth;
    }

function addYanaKaydiriniz() {
  const input = document.getElementById('inputDesc');
  const desc = document.getElementById('desc');

  // Metni ekle
  input.value += ' Yana Kaydırınız';

  // HTML olarak biçimle
  desc.innerHTML = cleanText = input.value.replace(
    'Yana Kaydırınız',
    '<span style="display: inline-flex; align-items: center; gap: 8px;"><a href="#" class="arrow right"><i></i><svg><use xlink:href="#circle"></use></svg></a><span>Yana Kaydırınız</span></span>'
  );
}

//urlden img ekleme
function setBgFromUrl() {
  const url = document.getElementById('bgUrlInput').value;
  if (url) {
    document.getElementById('bgImage').src = url;
    updateVisual();
  }
}
function toggleEditor() {
  const modal = document.getElementById('editorModal');
  modal.style.display = modal.style.display === 'none' ? 'block' : 'none';
}

function copyDesc() {
  const descText = document.getElementById('desc').innerText;
  navigator.clipboard.writeText(descText).then(() => {
    alert('Açıklama kopyalandı!');
  });
}

//görsel düzenleme 
 let cropper;

  function openCropModal() {
    const cropModal = document.getElementById('cropModal');
    const imageToCrop = document.getElementById('imageToCrop');
    const bgImage = document.getElementById('bgImage');

    if (!bgImage.src) {
      alert("Önce arka plan resmi seçin veya yükleyin.");
      return;
    }

    imageToCrop.src = bgImage.src;
    cropModal.style.display = 'flex';

    if (cropper) {
      cropper.destroy();
    }

    cropper = new Cropper(imageToCrop, {
      aspectRatio: 1,
      viewMode: 1,
      autoCropArea: 1,
    });
  }

  function closeCropModal() {
    const cropModal = document.getElementById('cropModal');
    cropModal.style.display = 'none';

    if (cropper) {
      cropper.destroy();
      cropper = null;
    }
  }

  function cropImage() {
    if (!cropper) return;

    const canvas = cropper.getCroppedCanvas({
      width: 800,
      height: 800,
    });

    const croppedDataUrl = canvas.toDataURL('image/png');
    document.getElementById('bgImage').src = croppedDataUrl;

    closeCropModal();
  }
document.getElementById('cropModal').addEventListener('click', function (e) {
  if (e.target.id === 'cropModal') {
    closeCropModal();
  }
});
  </script>
